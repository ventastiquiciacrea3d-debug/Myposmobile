name: my_pos_mobile_barcode
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  get_it: ^8.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  dio: ^5.9.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  mobile_scanner: ^7.0.1
  google_mlkit_barcode_scanning: ^0.13.0
  permission_handler: ^12.0.1
  flutter_typeahead: ^5.2.0
  lottie: ^3.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_contacts: ^1.1.9+2
  fluttertoast: ^8.2.12
  collection: ^1.19.1
  image_picker: ^1.1.2
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.0
  package_info_plus: ^8.3.0
  print_bluetooth_thermal: ^1.1.6
  esc_pos_utils_plus: ^2.0.4
  image: ^4.5.4
  screenshot: ^3.0.0
  file_picker: ^10.3.3
  csv: ^6.0.0
  share_plus: ^12.0.0
  flutter_background_service: ^5.1.0

  # ✓ DELTA SYNC: ObjectBox for high-performance local storage
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3

  # ✓ DELTA SYNC: Firebase for push notifications (OPCIONAL)
  # firebase_core: ^3.10.0
  # firebase_messaging: ^15.1.6

  # ✓ POLLING INTELIGENTE: Notificaciones locales (sin FCM)
  flutter_local_notifications: ^18.0.1

  # ✓ OPTIMIZACIÓN EXTREMA BATERÍA: Sensores y estado del dispositivo
  battery_plus: ^6.0.3
  sensors_plus: ^6.0.1

  # ✓ BACKGROUND SYNC: Manejado por flutter_background_service (línea 55)
  # workmanager: ^0.5.2          # ❌ ELIMINADO - APIs obsoletas, causa errores de compilación
  # background_fetch: ^1.3.14    # ❌ ELIMINADO - No usado, redundante con flutter_background_service

  # ✓ IMAGE CACHE: Compresión y optimización de imágenes
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_lint: ^2.3.13

  # ✓ DELTA SYNC: ObjectBox code generator
  objectbox_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          style: italic
          weight: 700